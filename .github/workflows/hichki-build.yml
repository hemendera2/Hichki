name: Hichki build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HICHKI_SUPABASE_URL: ${{ secrets.HICHKI_SUPABASE_URL }}
  HICHKI_SUPABASE_ANON_KEY: ${{ secrets.HICHKI_SUPABASE_ANON_KEY }}
  HICHKI_VAPID_PUBLIC_KEY: ${{ secrets.HICHKI_VAPID_PUBLIC_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/hichki-realtime.js
          test -f dist/hichki-music.js
