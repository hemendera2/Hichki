name: Hichki build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HICHKI_SUPABASE_URL: ${{ secrets.HICHKI_SUPABASE_URL }}
  HICHKI_SUPABASE_ANON_KEY: ${{ secrets.HICHKI_SUPABASE_ANON_KEY }}
  HICHKI_VAPID_PUBLIC_KEY: ${{ secrets.HICHKI_VAPID_PUBLIC_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Recover deployed source for isolated build
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f vendor/hichki-web/index.html; then
            rm -rf .recovered-hichki
            mkdir -p .recovered-hichki
            wget --mirror --page-requisites --convert-links --adjust-extension --no-parent --directory-prefix=.recovered-hichki https://hichki.netlify.app/
            src=.recovered-hichki/hichki.netlify.app
            test -f "$src/index.html"
            mkdir -p vendor/hichki-web
            cp -a "$src"/. vendor/hichki-web/
            rm -rf .recovered-hichki
          fi
      - name: Ensure build uses vendored source when available
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/prepare-web.mjs')
          s=p.read_text()
          marker="const LOCAL_HICHKI='vendor/hichki-web/index.html';"
          if marker not in s:
              s=s.replace("const base = 'https://hichki.netlify.app';", marker+"\nconst localRoot='vendor/hichki-web';\n")
              old="for (const file of requiredRemoteFiles) {"
              new="if (existsSync(LOCAL_HICHKI)) {\n  await copyFile(LOCAL_HICHKI, 'index.html');\n  for (const file of requiredRemoteFiles.slice(1)) { if (existsSync(`${localRoot}/${file}`)) await copyFile(`${localRoot}/${file}`, `public/${file}`); }\n} else {\n  for (const file of requiredRemoteFiles) {"
              if old not in s: raise SystemExit('prepare-web download loop not found')
              s=s.replace(old,new,1)
              needle="  await writeFile(file === 'index.html' ? 'index.html' : `public/${file}`, body);\n}\n"
              replacement="  await writeFile(file === 'index.html' ? 'index.html' : `public/${file}`, body);\n  }\n}\n"
              if needle not in s: raise SystemExit('prepare-web loop ending changed')
              s=s.replace(needle,replacement,1)
              p.write_text(s)
      - name: Static JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/prepare-web.mjs
          node --check scripts/ensure-vendored-source.mjs
          node --check scripts/inject-hichki-bridge.mjs
          node --check hichki-realtime.js
          node --check hichki-chat-api.js
          node --check hichki-offline-queue.js
          node --check hichki-music.js
          node --check hichki-web-push.js
          node --check hichki-push-bridge.js
          node --check native.js
      - name: Build production bundle
        run: npm run build
      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/hichki-realtime.js
          test -f dist/hichki-chat-api.js
          test -f dist/hichki-offline-queue.js
          test -f dist/hichki-music.js
          test -f dist/hichki-web-push.js
          test -f dist/hichki-push-bridge.js
