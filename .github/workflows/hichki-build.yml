name: Hichki build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HICHKI_SUPABASE_URL: ${{ secrets.HICHKI_SUPABASE_URL }}
  HICHKI_SUPABASE_ANON_KEY: ${{ secrets.HICHKI_SUPABASE_ANON_KEY }}
  HICHKI_VAPID_PUBLIC_KEY: ${{ secrets.HICHKI_VAPID_PUBLIC_KEY }}

concurrency:
  group: hichki-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify checkout and build-source contract
        shell: bash
        run: |
          set -euo pipefail
          echo "HICHKI_CI_CONTRACT=V5"
          echo "Building commit: $(git rev-parse HEAD)"
          echo "Expected commit: ${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -s scripts/prepare-web.mjs
          test -s scripts/copy-runtime-assets.mjs
          test -s scripts/verify-build-output.mjs
          ! grep -Fq "'icon-512-maskable.png'," scripts/prepare-web.mjs
          grep -Fq "copyFile('public/icon-512.png', 'public/icon-512-maskable.png')" scripts/prepare-web.mjs
          grep -Fq "scripts/local-netlify-fetch.mjs" package.json
          grep -Fq "scripts/copy-runtime-assets.mjs" package.json
          grep -Fq "scripts/verify-build-output.mjs" .github/workflows/hichki-build.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Recover deployed source for isolated build
        shell: bash
        run: |
          set -euo pipefail
          if test -s vendor/hichki-web/index.html; then
            echo 'Vendored Hichki source already present.'
            exit 0
          fi

          rm -rf vendor/hichki-web
          mkdir -p vendor/hichki-web
          base='https://hichki.netlify.app'

          for file in index.html manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png; do
            curl --fail --silent --show-error --location \
              --output "vendor/hichki-web/$file" \
              "$base/$file"
          done

          test -s vendor/hichki-web/index.html
          test -s vendor/hichki-web/manifest.webmanifest
          test -s vendor/hichki-web/icon-192.png
          test -s vendor/hichki-web/icon-512.png
          test -s vendor/hichki-web/apple-touch-icon.png

      - name: Static JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/prepare-web.mjs
          node --check scripts/local-netlify-fetch.mjs
          node --check scripts/ensure-vendored-source.mjs
          node --check scripts/inject-hichki-bridge.mjs
          node --check scripts/copy-runtime-assets.mjs
          node --check scripts/verify-build-output.mjs
          node --check hichki-realtime.js
          node --check hichki-chat-api.js
          node --check hichki-offline-queue.js
          node --check hichki-music.js
          node --check hichki-web-push.js
          node --check hichki-push-bridge.js
          node --check native.js

      - name: Verify runtime asset sources before build
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            hichki-realtime.js \
            hichki-chat-api.js \
            hichki-offline-queue.js \
            hichki-music.js \
            hichki-web-push.js \
            hichki-push-bridge.js \
            hichki-ux-polish.css; do
            test -s "$file"
            echo "runtime source verified: $file ($(wc -c < "$file") bytes)"
          done

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifier commit: $(git rev-parse HEAD)"
          echo "Expected commit: ${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node scripts/verify-build-output.mjs
