name: Hichki build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HICHKI_SUPABASE_URL: ${{ secrets.HICHKI_SUPABASE_URL }}
  HICHKI_SUPABASE_ANON_KEY: ${{ secrets.HICHKI_SUPABASE_ANON_KEY }}
  HICHKI_VAPID_PUBLIC_KEY: ${{ secrets.HICHKI_VAPID_PUBLIC_KEY }}

concurrency:
  group: hichki-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Recover deployed source for isolated build
        shell: bash
        run: |
          set -euo pipefail
          if test -f vendor/hichki-web/index.html; then
            echo 'Vendored Hichki source already present.'
            exit 0
          fi

          rm -rf .recovered-hichki
          mkdir -p .recovered-hichki

          # The deployed Hichki page is the canonical frontend source until the
          # original frontend is checked into this repository. Wget may return a
          # non-zero code for optional remote assets; the index and usable tree
          # are validated explicitly below instead of treating those as success.
          set +e
          wget --mirror --page-requisites --convert-links --adjust-extension --no-parent \
            --directory-prefix=.recovered-hichki \
            https://hichki.netlify.app/
          wget_status=$?
          set -e

          src=$(find .recovered-hichki -type f -name index.html -print -quit)
          if test -z "$src"; then
            echo "Unable to recover Hichki frontend: no index.html was downloaded (wget status $wget_status)." >&2
            exit 1
          fi

          rm -rf vendor/hichki-web
          mkdir -p vendor/hichki-web
          root=$(dirname "$src")
          cp -a "$root"/. vendor/hichki-web/
          rm -rf .recovered-hichki
          test -s vendor/hichki-web/index.html

      - name: Static JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/prepare-web.mjs
          node --check scripts/local-netlify-fetch.mjs
          node --check scripts/ensure-vendored-source.mjs
          node --check scripts/inject-hichki-bridge.mjs
          node --check hichki-realtime.js
          node --check hichki-chat-api.js
          node --check hichki-offline-queue.js
          node --check hichki-music.js
          node --check hichki-web-push.js
          node --check hichki-push-bridge.js
          node --check native.js

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/hichki-realtime.js
          test -s dist/hichki-chat-api.js
          test -s dist/hichki-offline-queue.js
          test -s dist/hichki-music.js
          test -s dist/hichki-web-push.js
          test -s dist/hichki-push-bridge.js
