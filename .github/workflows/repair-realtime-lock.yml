name: Repair Hichki realtime lock once

on:
  push:
    branches: [feat/hichki-completion-20260908]

permissions:
  contents: write

concurrency:
  group: hichki-realtime-lock-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate relay lock from manifest
        shell: bash
        run: |
          set -euo pipefail
          cd realtime-server
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run check
          node -e "const p=require('./package-lock.json'); if(p.name!=='hichki-realtime-server'||p.lockfileVersion!==3) process.exit(1)"
      - name: Commit npm-generated relay lock
        shell: bash
        run: |
          set -euo pipefail
          git add realtime-server/package-lock.json
          if git diff --cached --quiet; then
            echo 'Relay lock already correct.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerate realtime npm lock [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
