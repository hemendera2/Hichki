name: Hichki Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feat/hichki-completion-20260908]

permissions:
  contents: read

env:
  HICHKI_SUPABASE_URL: ${{ secrets.HICHKI_SUPABASE_URL }}
  HICHKI_SUPABASE_ANON_KEY: ${{ secrets.HICHKI_SUPABASE_ANON_KEY }}
  HICHKI_SOCKET_URL: ${{ secrets.HICHKI_SOCKET_URL }}
  HICHKI_VAPID_PUBLIC_KEY: ${{ secrets.HICHKI_VAPID_PUBLIC_KEY }}

concurrency:
  group: hichki-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -s package-lock.json
          test -s scripts/verify-release-config.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "console.log('TypeScript:', require('typescript/package.json').version)"
          test -x node_modules/.bin/tsc
          test -x node_modules/.bin/capacitor
          test -z "$(git status --porcelain package-lock.json)"

      - name: Build and verify web app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-config.mjs
          npm run build
          npm run verify:build
          node scripts/verify-release-config.mjs dist/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          chmod +x android/gradlew

      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace --no-daemon --warning-mode all

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon --warning-mode all

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hichki-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
