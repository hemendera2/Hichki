name: Hichki iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [main, feat/hichki-completion-20260908]

permissions:
  contents: read

env:
  HICHKI_SUPABASE_URL: ${{ secrets.HICHKI_SUPABASE_URL }}
  HICHKI_SUPABASE_ANON_KEY: ${{ secrets.HICHKI_SUPABASE_ANON_KEY }}
  HICHKI_SOCKET_URL: ${{ secrets.HICHKI_SOCKET_URL }}
  HICHKI_VAPID_PUBLIC_KEY: ${{ secrets.HICHKI_VAPID_PUBLIC_KEY }}

concurrency:
  group: hichki-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -s package-lock.json
          test -s scripts/verify-release-config.mjs

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_26" ]; then sudo xcode-select -s "$XCODE_26/Contents/Developer"; fi
          xcode-select -p
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -x node_modules/.bin/capacitor
          test -z "$(git status --porcelain package-lock.json)"

      - name: Build and verify web app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-config.mjs
          npm run build
          npm run verify:build
          node scripts/verify-release-config.mjs dist/index.html

      - name: Create iOS project with SPM
        run: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift packages
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Verify iOS project
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/Info.plist

      - name: Build iOS simulator app
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Verify iOS app
        run: test -d ios/App/build/Build/Products/Debug-iphonesimulator/App.app

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hichki-ios-simulator-${{ github.sha }}
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
