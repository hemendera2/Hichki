name: Hichki iOS Simulator
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - name: Build iOS simulator
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: hichki-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
