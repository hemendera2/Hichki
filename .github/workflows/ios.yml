name: Hichki iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hichki-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_26" ]; then sudo xcode-select -s "$XCODE_26/Contents/Developer"; fi
          xcode-select -p
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create iOS project with SPM
        run: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift packages
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Verify iOS project
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/Info.plist

      - name: Build iOS simulator app
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Verify iOS app
        run: test -d ios/App/build/Build/Products/Debug-iphonesimulator/App.app

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hichki-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
