name: Recover Hichki deployed source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: hichki-source-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check vendored Hichki base source
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/hichki-web/index.html
          test -s vendor/hichki-web/manifest.webmanifest
          test -s vendor/hichki-web/icon-192.png
          test -s vendor/hichki-web/icon-512.png
          test -s vendor/hichki-web/apple-touch-icon.png
          echo 'Vendored Hichki base source is present and authoritative.'
