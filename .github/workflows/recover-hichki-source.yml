name: Recover Hichki deployed source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: hichki-source-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check whether deployed source is already vendored
        id: source
        shell: bash
        run: |
          if test -f vendor/hichki-web/index.html; then
            echo 'missing=false' >> "$GITHUB_OUTPUT"
          else
            echo 'missing=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror deployed Hichki artifact
        if: steps.source.outputs.missing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovered-hichki
          mkdir -p .recovered-hichki
          set +e
          wget --mirror --page-requisites --convert-links --adjust-extension --no-parent \
            --directory-prefix=.recovered-hichki \
            https://hichki.netlify.app/
          status=$?
          set -e
          src=$(find .recovered-hichki -type f -name index.html -print -quit)
          if test -z "$src"; then
            echo "Source recovery failed: no index.html was downloaded (wget status $status)." >&2
            exit 1
          fi
          rm -rf recovered-hichki
          mkdir -p recovered-hichki
          cp -a "$(dirname "$src")"/. recovered-hichki/
          test -s recovered-hichki/index.html
          rm -rf .recovered-hichki

      - name: Validate recovered source
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.source.outputs.missing }}" = 'true'; then
            test -s recovered-hichki/index.html
          else
            test -s vendor/hichki-web/index.html
          fi

      - name: Publish recovered source artifact
        if: steps.source.outputs.missing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hichki-deployed-source
          path: recovered-hichki/
          if-no-files-found: error
